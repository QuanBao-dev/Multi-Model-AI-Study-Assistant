name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUNIT_VERSION: 1.10.2

jobs:
  build-and-test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # The app is compiled without the tests, so it cannot depend on JUnit.
      - name: Compile app
        run: |
          find src -name '*.java' -not -path 'src/tests/*' > app-sources.txt
          javac -d out/app @app-sources.txt

      # lib/ is ignored by git, so the JUnit jar is downloaded here.
      - name: Download JUnit
        if: hashFiles('src/tests/**/*.java') != ''
        run: |
          mkdir -p lib
          curl -sSfL --retry 3 -o lib/junit.jar \
            "https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/${JUNIT_VERSION}/junit-platform-console-standalone-${JUNIT_VERSION}.jar"

      - name: Compile tests
        if: hashFiles('src/tests/**/*.java') != ''
        run: |
          find src/tests -name '*.java' > test-sources.txt
          javac -d out/test -cp out/app:lib/junit.jar @test-sources.txt

      # The runner has no display: a test that opens a Swing window fails here.
      - name: Run tests
        if: hashFiles('src/tests/**/*.java') != ''
        run: |
          java -jar lib/junit.jar execute \
            --class-path out/app:out/test \
            --scan-class-path out/test \
            --fail-if-no-tests \
            --details tree \
            --disable-banner

      - name: Package jar
        run: jar --create --file study-assistant.jar --main-class StudyAssistantApp -C out/app .

      - uses: actions/upload-artifact@v7
        with:
          name: study-assistant-jar
          path: study-assistant.jar
          if-no-files-found: error
